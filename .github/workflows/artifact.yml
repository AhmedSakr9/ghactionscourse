name: artifact demo
on:
  push:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: create a local file
        run: echo "This is a test file" > file-artifact.txt

      - uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: file-artifact.txt

  job2:
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact

      - run: cat file-artifact.txt

